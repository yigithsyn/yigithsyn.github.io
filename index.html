<!DOCTYPE html>
<html lang="en" data-bs-theme="light">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Defter</title>
    <!-- Framework ve simgeler; proje stilleri, sayfa yapısı ve yazdırma kurallarından önce yüklenir. -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/svg.js/3.2.4/svg.min.js" defer></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="css/page-layout.css" rel="stylesheet">
    <link href="css/page-navigation.css" rel="stylesheet">
    <link href="css/image-upload.css" rel="stylesheet">
    <link href="css/print.css" rel="stylesheet">
</head>

<body>
    <!-- Sayfa ölçüsü ve yönü kullanıcı tarafından değiştirilebilir; seçimler tarayıcıda saklanır. -->
    <nav id="toolbar" class="navbar bg-body fg-body border-bottom px-3" data-bs-theme="light">
        <span class="navbar-brand mb-0 h1">Defter</span>
        <div class="d-flex align-items-center gap-2">
            <label for="page-size" class="mb-0">Page size</label>
            <select id="page-size" class="form-control form-control-sm w-auto">
                <option value="A4" selected>A4</option>
                <option value="A5">A5</option>
                <option value="A6">A6</option>
            </select>
            <label for="page-orientation" class="mb-0">Orientation</label>
            <select id="page-orientation" class="form-control form-control-sm w-auto">
                <option value="portrait" selected>Portrait</option>
                <option value="landscape">Landscape</option>
            </select>
            <button id="print" class="btn-outline btn-sm theme-secondary">Print</button>
        </div>
    </nav>

    <!-- Gezinme denetimleri ekranda sabit kalır; JavaScript etkin sayfaya göre günceller. -->
    <div id="page-nav" role="group" aria-label="Sayfa geçişi">
        <button id="page-prev" type="button" class="btn-solid theme-secondary btn-icon" title="Önceki sayfa" aria-label="Önceki sayfa">
            <i class="bi bi-chevron-up" aria-hidden="true"></i>
        </button>
        <span id="page-counter" class="page-counter" aria-live="polite">1 / 1</span>
        <button id="page-next" type="button" class="btn-solid theme-secondary btn-icon" title="Sonraki sayfa" aria-label="Sonraki sayfa">
            <i class="bi bi-chevron-down" aria-hidden="true"></i>
        </button>
    </div>

    <!-- Görsel yükleme düğmeleri ekranın altında yüzer; yüklenenler geçici pencerede listelenir. -->
    <div id="image-upload" role="group" aria-label="Görsel yükleme">
        <button id="upload-add" type="button" class="btn-solid theme-secondary btn-icon" title="Resim ekle" aria-label="Resim ekle">
            <i class="bi bi-image" aria-hidden="true"></i>
        </button>
        <button id="upload-show" type="button" class="btn-solid theme-secondary btn-icon" title="Yüklenen resimler" aria-label="Yüklenen resimler">
            <i class="bi bi-images" aria-hidden="true"></i>
        </button>
        <input id="upload-input" type="file" accept="image/*" multiple hidden>
    </div>
    <dialog id="upload-dialog" aria-labelledby="upload-title">
        <div class="upload-head">
            <strong id="upload-title">Yüklenen resimler</strong>
            <button id="upload-close" type="button" class="btn-outline btn-sm theme-secondary" aria-label="Kapat">
                <i class="bi bi-x-lg" aria-hidden="true"></i>
            </button>
        </div>
        <div class="upload-body">
            <p id="upload-empty" hidden>Henüz resim yüklenmedi.</p>
            <div class="upload-split">
                <ul id="upload-list"></ul>
                <div id="upload-preview"><img alt="" hidden></div>
            </div>
        </div>
    </dialog>

    <!-- Sayfalama sonucu oluşturulan sayfalar bu alana eklenir. -->
    <main id="pages"></main>

    <!-- Kaynak içerik content/source.html dosyasından yüklenir, gizli tutulur ve JavaScript tarafından ölçülüp sayfalara kopyalanır. -->
    <div id="source"></div>

    <!-- jQuery, sayfa modüllerinden önce yüklenmelidir; script.js uygulamanın başlangıç noktasıdır. -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
    <script type="module" src="js/script.js"></script>

</body>
